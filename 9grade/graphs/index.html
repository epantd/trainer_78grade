<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр · Графы и количество путей</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>🕸️ Графы и количество путей</h1>
    <p class="app-subtitle">Найдите количество путей из начальной вершины в конечную</p>
    <div class="progress-wrap">
      <div class="progress-text" id="progressText"></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </header>

  <main>
    <section id="screen-quiz">
      <div class="task">
        <p class="instruction" id="instruction"></p>
        
        <div class="graph-container" id="graphContainer">
          <!-- Сюда вставится SVG с графом -->
        </div>

        <div class="input-wrap">
          <input type="text" inputmode="numeric" class="input-answer" id="answerInput" placeholder="Введите число" autocomplete="off">
        </div>

        <p class="feedback" id="feedback"></p>
        
        <div class="actions">
          <button class="btn btn-primary" id="checkBtn" type="button">Проверить</button>
          <button class="btn btn-success" id="nextBtn" type="button" hidden>Далее →</button>
        </div>
      </div>
    </section>

    <section id="screen-result" hidden>
      <div class="task finish">
        <div class="finish-emoji" id="finishEmoji">🎉</div>
        <h2 id="finishTitle">Модуль пройден!</h2>
        <p id="finishText"></p>
        <div class="actions">
          <button class="btn btn-primary" id="retryBtn" type="button">Пройти заново</button>
          <button class="btn btn-outline" id="backBtn" type="button">← Назад</button>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
