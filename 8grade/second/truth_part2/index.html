<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таблицы истинности — часть 2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Таблицы истинности · часть 2</h1>
      <div class="legend">
        <span><b>¬</b> — отрицание</span>
        <span><b>∧</b> — конъюнкция (И)</span>
        <span><b>∨</b> — дизъюнкция (ИЛИ)</span>
        <span><b>→</b> — импликация (следствие)</span>
        <span><b>≡</b> — эквивалентность (равнозначность)</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-text" id="progress-text">Задание 1</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
    </header>
    <main id="task-container"></main>
  </div>
  <script src="script.js"></script>
</body>
</html>
